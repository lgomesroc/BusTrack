name: Backend Tests

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Start BusTrack environment
        run: |
          docker compose up -d --build

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:5066/api/Health; then
              echo
              echo "Backend disponível."
              exit 0
            fi

            echo "Aguardando backend..."
            sleep 2
          done

          echo "Backend não ficou disponível."
          docker compose logs backend
          exit 1

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:4200; then
              echo
              echo "Frontend disponível."
              exit 0
            fi

            echo "Aguardando frontend..."
            sleep 2
          done

          echo "Frontend não ficou disponível."
          docker-compose logs frontend
          exit 1

      - name: Restore backend
        run: dotnet restore BusTrack.csproj

      - name: Restore tests
        run: dotnet restore BusTrack.Tests/BusTrack.Tests.csproj

      - name: Run backend tests
        env:
          ConnectionStrings__BusTrackDBConnection: mongodb://localhost:27017
          ConnectionStrings__DatabaseName: BusTrackDB
          BUSTRACK_TEST_EMAIL: ${{ secrets.BUSTRACK_TEST_EMAIL }}
          BUSTRACK_TEST_PASSWORD: ${{ secrets.BUSTRACK_TEST_PASSWORD }}
        run: dotnet test BusTrack.Tests/BusTrack.Tests.csproj --configuration Release --no-restore

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop BusTrack environment
        if: always()
        run: docker compose down -v

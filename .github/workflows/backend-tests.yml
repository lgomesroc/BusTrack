name: Backend Tests

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend
        run: dotnet restore BusTrack.csproj

      - name: Restore tests
        run: dotnet restore BusTrack.Tests/BusTrack.Tests.csproj

      - name: Run backend tests
        env:
          ConnectionStrings__BusTrackDBConnection: mongodb://localhost:27017
          ConnectionStrings__DatabaseName: BusTrackDB
        run: dotnet test BusTrack.Tests/BusTrack.Tests.csproj --configuration Release --no-restore

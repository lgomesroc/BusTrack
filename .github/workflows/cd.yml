name: CD

on:
  workflow_run:
    workflows:
      - CI

    types:
      - completed

jobs:

  deploy:

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'upgrade-dotnet-10'

    uses: ./.github/workflows/deploy.yml

    secrets: inherit

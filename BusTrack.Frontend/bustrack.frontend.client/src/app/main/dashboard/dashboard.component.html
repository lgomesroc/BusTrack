<div class="dashboard-container">

  <app-sidebar></app-sidebar>

  <main class="main-content">

    <header class="top-bar">
      <div>
        <span class="system-name">Bus Track</span>
      </div>

      <div class="user-area">
        <span>{{ isAdmin ? 'Área administrativa' : 'Área do usuário' }}</span>

        <button
          type="button"
          class="logout-button"
          (click)="sair()">
          Sair
        </button>
      </div>
    </header>

    <section class="dashboard-body">

      <div class="welcome-section">
        <h1>Bem-vindo ao Bus Track</h1>

        <p>
          Consulte os registros e cadastre novas informações de viagens,
          ônibus, rotas, motoristas, passageiros e manutenção.
        </p>
      </div>

      <section class="dashboard-cards">

        <button
          type="button"
          class="dashboard-card"
          (click)="navegarParaViagens()">

          <span class="card-icon">🚌</span>

          <div>
            <h2>Viagens</h2>
            <p>
              Consulte as viagens cadastradas e registre novas viagens.
            </p>
          </div>

        </button>

        <button
          type="button"
          class="dashboard-card"
          (click)="navegarParaOnibus()">

          <span class="card-icon">🚍</span>

          <div>
            <h2>Ônibus</h2>
            <p>
              Consulte os ônibus cadastrados e registre novos ônibus.
            </p>
          </div>

        </button>

        <button
          type="button"
          class="dashboard-card"
          (click)="navegarParaRotas()">

          <span class="card-icon">🗺️</span>

          <div>
            <h2>Rotas</h2>
            <p>
              Consulte as rotas cadastradas e registre novas rotas.
            </p>
          </div>

        </button>

        <button
          type="button"
          class="dashboard-card"
          (click)="navegarParaMotoristas()">

          <span class="card-icon">👤</span>

          <div>
            <h2>Motoristas</h2>
            <p>
              Consulte os motoristas cadastrados e registre novos motoristas.
            </p>
          </div>

        </button>

        <button
          type="button"
          class="dashboard-card"
          (click)="navegarParaPassageiros()">

          <span class="card-icon">👥</span>

          <div>
            <h2>Passageiros</h2>
            <p>
              Consulte os passageiros cadastrados e registre novos passageiros.
            </p>
          </div>

        </button>

        <button
          type="button"
          class="dashboard-card"
          (click)="navegarParaManutencao()">

          <span class="card-icon">🔧</span>

          <div>
            <h2>Serviços / Manutenção</h2>
            <p>
              Consulte o histórico e registre novas manutenções.
            </p>
          </div>

        </button>

      </section>

    </section>

  </main>

</div>

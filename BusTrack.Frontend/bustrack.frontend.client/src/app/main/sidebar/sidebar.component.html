<aside class="sidebar">
  <div class="user-info">
    <h2>{{ nomeUsuario }}</h2>
    <p *ngIf="emailUsuario">{{ emailUsuario }}</p>
    <p>Perfil: {{ perfilUsuario }}</p>
  </div>
  <div class="usability-rules">
    <h3>Regras de Usabilidade</h3>
    <ul>
      <li>Temporizador de inatividade: 20 minutos</li>
      <li>Bloqueio de cópia de dados</li>
      <li>Bloqueio de atalhos do teclado</li>
      <li>Navegação no navegador bloqueada</li>
    </ul>
  </div>
</aside>

<div class="recovery-page">
  <main class="recovery-card">
    <section class="visual-panel">
      <img src="assets/imagem/OIG4.jpeg" alt="Ilustração do Bus Track">
      <p>Bem-vindo ao Bus Track. Acesse sua conta ou crie um cadastro para continuar.</p>
    </section>

    <section class="form-panel">
      <h1>Bem-vindo ao Bus Track</h1>
      <p>Organize e acompanhe as informações do sistema em um só lugar.</p>

      <div class="button-container">
        <button type="button" (click)="entrarNoSistema()">Entrar no sistema</button>
        <button type="button" class="secondary" (click)="criarConta()">Criar conta</button>
      </div>
    </section>
  </main>
</div>

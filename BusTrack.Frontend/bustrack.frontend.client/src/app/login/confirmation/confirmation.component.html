<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmação de Cadastro - Sistema Bus Track</title>
</head>

<body>
  <div class="container">

    <h1 class="centered-title">
      Seja bem-vindo à página de Confirmação do Sistema Bus Track
    </h1>

    <img
      class="img-responsive centralized-image"
      src="assets/imagem/OIG4.jpeg"
      alt="Sistema Bus Track Logo"
      style="width: 200px; height: auto;"
    >

    <div class="confirmation-message">
      <p>
        Obrigado por se cadastrar no Sistema Bus Track.
      </p>

      <p>
        Sua conta foi criada com sucesso.
        Clique no botão abaixo para continuar.
      </p>
    </div>

    <div class="button-container">
      <button
        type="button"
        class="blue-button"
        (click)="confirmarCadastro()"
      >
        Confirmar Cadastro
      </button>
    </div>

  </div>
</body>
</html>

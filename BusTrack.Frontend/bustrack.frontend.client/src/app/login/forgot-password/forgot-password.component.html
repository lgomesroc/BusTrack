<div class="recovery-page">
  <main class="recovery-card">
    <section class="visual-panel">
      <img src="assets/imagem/OIG4.jpeg" alt="Ilustração do Bus Track">
      <p>Recupere o acesso à sua conta Bus Track.</p>
    </section>

    <section class="form-panel">
      <h1>Esqueci minha senha</h1>

      <p>
        Informe seu e-mail e defina uma nova senha.
        A senha não pode ser igual à atual nem às cinco senhas anteriores.
      </p>

      <form (ngSubmit)="submit()" #f="ngForm">
        <label for="email">E-mail cadastrado</label>
        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          autocomplete="email"
          required
          email
        >

        <label for="newPassword">Nova senha</label>
        <input
          id="newPassword"
          name="newPassword"
          type="password"
          [(ngModel)]="newPassword"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <label for="confirmPassword">Confirme a nova senha</label>
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <p class="hint">
          A senha deve cumprir a política de segurança do sistema.
        </p>

        <p class="error" *ngIf="errorMessage" role="alert">
          {{ errorMessage }}
        </p>

        <p class="success" *ngIf="successMessage" role="status">
          {{ successMessage }}
        </p>

        <button
          type="submit"
          [disabled]="!f.valid || isSubmitting"
        >
          {{ isSubmitting ? 'Validando...' : 'Redefinir senha' }}
        </button>

        <button
          type="button"
          class="secondary"
          (click)="backToLogin()"
        >
          Voltar ao login
        </button>
      </form>
    </section>
  </main>
</div>

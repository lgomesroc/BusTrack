<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta - Sistema Bus Track</title>
</head>

<body>
  <div class="container">

    <h1 class="centered-title">
      Seja bem-vindo à página de Criar Conta do Sistema Bus Track
    </h1>

    <img
      class="img-responsive centralized-image"
      src="assets/imagem/OIG4.jpeg"
      alt="Sistema Bus Track Logo"
      style="width: 200px; height: auto;"
    >

    <form #f="ngForm" (ngSubmit)="criarConta()">

      <div class="form-group">
        <label for="nomeCompleto">Nome Completo:</label>

        <input
          type="text"
          id="nomeCompleto"
          name="nomeCompleto"
          [(ngModel)]="fullName"
          required
          autocomplete="name"
        >
      </div>

      <div class="form-group">
        <label for="cpf">CPF:</label>

        <input
          type="text"
          id="cpf"
          name="cpf"
          [ngModel]="cpf"
          (ngModelChange)="formatarCPF($event)"
          maxlength="14"
          inputmode="numeric"
          placeholder="000.000.000-00"
          required
        >
      </div>

      <div class="form-group">
        <label for="email">E-mail:</label>

        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="password">Senha:</label>

        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          autocomplete="new-password"
        >
      </div>

      <div class="form-group">
        <label for="passwordConfirmation">Confirmar Senha:</label>

        <input
          type="password"
          id="passwordConfirmation"
          name="passwordConfirmation"
          [(ngModel)]="confirmPassword"
          required
          autocomplete="new-password"
        >
      </div>

      <div
        class="error-message"
        *ngIf="errorMessage"
      >
        {{ errorMessage }}
      </div>

      <div class="button-container">

        <button
          type="submit"
          class="blue-button"
          [disabled]="!f.valid"
        >
          Criar Conta
        </button>

        <button
          type="button"
          class="blue-button"
          (click)="cancelar()"
        >
          Cancelar
        </button>

        <button
          type="button"
          class="blue-button"
          (click)="realizarLogin()"
        >
          Realizar Login
        </button>

      </div>

    </form>
  </div>
</body>
</html>

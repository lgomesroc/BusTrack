
<div class="container">
  <h1 class="centered-title">
    Seja bem-vindo à página de entrada do Sistema Bus Track
  </h1>

  <img
    class="img-responsive centralized-image"
    src="assets/imagem/OIG4.jpeg"
    alt="Sistema Bus Track"
    style="width: 200px; height: auto;"
  >

  <form #f="ngForm" (ngSubmit)="onSubmit(f)">
    <div class="form-group">
      <label for="email">E-mail:</label>
      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="email"
        autocomplete="username"
        required
      >
    </div>

    <div class="form-group">
      <label for="password">Senha:</label>
      <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="password"
        autocomplete="current-password"
        required
      >
    </div>

    <p *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>

    <div class="button-container">
      <button
        type="submit"
        class="blue-button"
        [disabled]="!f.valid"
      >
        Entrar
      </button>

      <button
        type="button"
        class="blue-button"
        (click)="openForgotPassword()"
      >
        Esqueci minha senha
      </button>

      <button
        type="button"
        class="blue-button"
        (click)="openChangePassword()"
      >
        Trocar senha
      </button>

      <button
        type="button"
        class="blue-button"
        (click)="cancelar()"
      >
        Cancelar
      </button>

      <button
        type="button"
        class="blue-button"
        (click)="voltar()"
      >
        Criar conta
      </button>
    </div>
  </form>
</div>

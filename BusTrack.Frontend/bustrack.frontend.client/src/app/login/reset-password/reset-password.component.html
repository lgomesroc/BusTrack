
<div class="recovery-page">
  <main class="recovery-card">
    <section class="visual-panel">
      <h2>BusTrack</h2>
      <p>
        Recupere o acesso à sua conta e defina uma nova senha com segurança.
      </p>
    </section>

    <section class="form-panel">
      <h1>Redefinir senha</h1>
      <p>Preencha os campos abaixo para cadastrar sua nova senha.</p>

      <form (ngSubmit)="submit()">
        <label for="email">E-mail da conta</label>
        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          autocomplete="username"
          placeholder="seu@email.com"
          required
        />

        <label for="recoveryCode">Código de recuperação</label>
        <input
          id="recoveryCode"
          name="recoveryCode"
          type="text"
          [(ngModel)]="recoveryCode"
          autocomplete="one-time-code"
          placeholder="Digite o código de recuperação"
          required
        />

        <label for="newPassword">Nova senha</label>
        <input
          id="newPassword"
          name="newPassword"
          type="password"
          [(ngModel)]="newPassword"
          autocomplete="new-password"
          placeholder="Digite a nova senha"
          minlength="8"
          required
        />

        <label for="confirmPassword">Confirmar nova senha</label>
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          autocomplete="new-password"
          placeholder="Digite novamente a nova senha"
          minlength="8"
          required
        />

        <p class="hint">
          A senha deve ter pelo menos 8 caracteres e os dois campos de senha
          precisam ser iguais.
        </p>

        <p *ngIf="errorMessage" class="error" role="alert">
          {{ errorMessage }}
        </p>

        <p *ngIf="successMessage" class="success" role="status">
          {{ successMessage }}
        </p>

        <button type="submit" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Redefinindo senha...' : 'Redefinir senha' }}
        </button>

        <button
          type="button"
          class="secondary"
          (click)="backToLogin()"
          [disabled]="isSubmitting"
        >
          Voltar para o login
        </button>
      </form>
    </section>
  </main>
</div>
